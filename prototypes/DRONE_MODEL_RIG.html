<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DRONE MODEL — RIG</title>
<!--
  DRONE_MODEL_RIG
  ------------------------------------------------------------------
  The drone as an actual model, not a board illustration.
  Lofted rotor blades, a shaped fuselage, a 3-axis gimbal, and a
  named hierarchy with real pivots so it can be animated.

  Rig                       Driver
    root                      setAttitude(pitch,roll,yaw) / setAltitude()
     └ hull                   (fixed to root)
     └ arm.FL/FR/RL/RR        setFold(0..1)      real hinge axes
        └ motor
           └ hub              setRotor(rpm)
     └ gimbal.yaw             setGimbal(pan,tilt)
        └ gimbal.roll
           └ gimbal.pitch     camera + lens

  ?t=N  freeze at N seconds   ?shot=1 hide the UI for clean captures
-->
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<style>
  :root{
    --bg:#0a0c0b; --ink:#e8ece9; --dim:#7e8a86; --faint:#39423f; --rule:#222a27;
    --c1:#3fd2e0; --c2:#a8e04a; --c3:#e055c0; --c4:#f5822e;
    --mono: ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
  body{font-family:var(--mono)}
  #gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:grab}
  #gl.drag{cursor:grabbing}

  .hud{position:fixed;z-index:5;font-size:8.5px;letter-spacing:.24em;color:var(--dim)}
  .hud.tl{top:22px;left:24px}
  .hud.tr{top:22px;right:24px;text-align:right}
  .hud .k{color:var(--ink);font-size:11px;letter-spacing:.34em;display:block;margin-bottom:9px}
  .hud b{color:var(--ink);font-weight:400}

  .panel{position:fixed;left:24px;bottom:22px;z-index:6;display:flex;gap:26px;
         align-items:flex-end;flex-wrap:wrap;max-width:calc(100vw - 48px)}
  .ctl{display:flex;flex-direction:column;gap:6px;min-width:126px}
  .ctl label{font-size:7.5px;letter-spacing:.26em;color:var(--dim);
             display:flex;justify-content:space-between;gap:10px}
  .ctl label b{color:var(--ink);font-weight:400;font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;background:none;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--rule)}
  input[type=range]::-moz-range-track{height:1px;background:var(--rule)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:7px;height:7px;
    border-radius:50%;background:var(--ink);margin-top:-3px}
  input[type=range]::-moz-range-thumb{width:7px;height:7px;border:0;border-radius:50%;background:var(--ink)}

  .btns{display:flex;gap:1px}
  button{font-family:var(--mono);font-size:7.5px;letter-spacing:.2em;color:var(--dim);
         background:none;border:1px solid var(--rule);padding:7px 11px;cursor:pointer}
  button:hover{color:var(--ink);border-color:var(--faint)}
  button.on{color:var(--bg);background:var(--ink);border-color:var(--ink)}
  button.go{color:var(--c1);border-color:#1e4a4f}
  button.go:hover{color:var(--bg);background:var(--c1);border-color:var(--c1)}
  body.shot .hud,body.shot .panel{display:none}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div class="hud tl">
  <span class="k">DRONE MODEL</span>
  RIGGED FOR ANIMATION<br>
  <b id="rTri">—</b> TRIANGLES · <b id="rPart">—</b> PARTS
</div>
<div class="hud tr">
  <span class="k">RIG STATE</span>
  FOLD <b id="rFold">—</b> · ROTOR <b id="rRpm">—</b> RPM<br>
  GIMBAL <b id="rGim">—</b> · ALT <b id="rAlt">—</b> M<br>
  DRAG ORBIT · WHEEL ZOOM
</div>

<div class="panel">
  <div class="ctl"><label>FOLD <b id="vFold">0.00</b></label>
    <input type="range" id="sFold" min="0" max="1" step="0.001" value="0"></div>
  <div class="ctl"><label>ROTOR RPM <b id="vRpm">0</b></label>
    <input type="range" id="sRpm" min="0" max="7000" step="10" value="0"></div>
  <div class="ctl"><label>GIMBAL PAN <b id="vPan">0°</b></label>
    <input type="range" id="sPan" min="-70" max="70" step="1" value="0"></div>
  <div class="ctl"><label>GIMBAL TILT <b id="vTilt">0°</b></label>
    <input type="range" id="sTilt" min="-90" max="30" step="1" value="0"></div>
  <div class="btns">
    <button id="bSimple">01 SIMPLE</button>
    <button id="bTech" class="on">02 TECHNICAL</button>
    <button id="bField">03 FIELD</button>
    <button id="bTarget">04 PARTICLE</button>
    <button id="bSolid">SOLID</button>
  </div>
  <div class="btns">
    <button id="bLaunch" class="go">▸ LAUNCH SEQUENCE</button>
    <button id="bReset">RESET</button>
  </div>
</div>

<script type="module">
import * as THREE from "three";
import { createDrone } from "./drone-model.js";
const Q = new URLSearchParams(location.search);
if(Q.get("shot")) document.body.classList.add("shot");
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ════════════════════════════════════════════════════════════════
   THE MODEL — one shared source of truth
   ════════════════════════════════════════════════════════════════ */
const scene = new THREE.Scene();
const D = createDrone(THREE, scene);
const { root, hull, parts, arms, rig, seams, setMode, updateSilhouettes,
        animateField, PERIOD, RADIUS:RAD, BOUNDS, SIZE, extras, cloudGeo, sampleSurface } = D;
const state = rig.state;

/* ════════════════════════════════════════════════════════════════
   RENDER + ORBIT
   ════════════════════════════════════════════════════════════════ */
const canvas = document.getElementById("gl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0x000000,0);

const camera = new THREE.PerspectiveCamera(30,1,0.1,200);
const HOME = { az:128, el:19, dist:RAD*2.55 };
const cam = { ...HOME };
function placeCamera(){
  const a=THREE.MathUtils.degToRad(cam.az), e=THREE.MathUtils.degToRad(cam.el);
  camera.position.set(Math.cos(e)*Math.sin(a)*cam.dist, Math.sin(e)*cam.dist + 0.05,
                      Math.cos(e)*Math.cos(a)*cam.dist);
  camera.lookAt(0,0.05,0);
}
let drag=null;
canvas.addEventListener("pointerdown",e=>{ drag={x:e.clientX,y:e.clientY}; canvas.classList.add("drag");
  canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove",e=>{ if(!drag) return;
  cam.az -= (e.clientX-drag.x)*0.32;
  cam.el  = THREE.MathUtils.clamp(cam.el + (e.clientY-drag.y)*0.24, -80, 85);
  drag={x:e.clientX,y:e.clientY}; });
addEventListener("pointerup",()=>{ drag=null; canvas.classList.remove("drag"); });
canvas.addEventListener("wheel",e=>{ e.preventDefault();
  cam.dist = THREE.MathUtils.clamp(cam.dist*(1+Math.sign(e.deltaY)*0.08), RAD*1.15, RAD*7); },{passive:false});

function resize(){ const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener("resize",resize); resize();

/* ---- launch sequence: proves the rig drives ------------------- */
let seq = null;
function launch(){ seq = { t:0 }; }
function runSequence(dt){
  if(!seq) return; const t = (seq.t += dt);
  const k=(a,b,v)=>THREE.MathUtils.clamp((v-a)/(b-a),0,1);
  const ease=v=>v*v*(3-2*v);
  rig.setFold(1 - ease(k(0.3,2.2,t)));                    // arms deploy
  rig.setRotor(ease(k(2.0,3.6,t))*5200);                  // spin up
  rig.setAltitude(ease(k(3.2,5.4,t))*1.15);               // lift
  rig.setAttitude(-ease(k(5.0,6.4,t))*9, Math.sin(t*1.2)*1.6*ease(k(3.4,5,t)), 0);
  rig.setGimbal(Math.sin(t*0.55)*34*ease(k(4.4,6,t)), -ease(k(4.8,6.6,t))*38);
  syncUI();
  if(t>8){ seq=null; }
}
function reset(){ seq=null; rig.setFold(0); rig.setRotor(0); rig.setAltitude(0);
  rig.setAttitude(0,0,0); rig.setGimbal(0,0); Object.assign(cam,HOME); syncUI(); }

/* ---- UI ------------------------------------------------------- */
const $ = id => document.getElementById(id);
const S = { fold:$("sFold"), rpm:$("sRpm"), pan:$("sPan"), tilt:$("sTilt") };
function syncUI(){
  S.fold.value=state.fold; S.rpm.value=state.rpm; S.pan.value=state.pan; S.tilt.value=state.tilt;
  $("vFold").textContent=state.fold.toFixed(2);
  $("vRpm").textContent =Math.round(state.rpm);
  $("vPan").textContent =Math.round(state.pan)+"°";
  $("vTilt").textContent=Math.round(state.tilt)+"°";
  $("rFold").textContent=state.fold.toFixed(2);
  $("rRpm").textContent =Math.round(state.rpm);
  $("rGim").textContent =`${Math.round(state.pan)}° / ${Math.round(state.tilt)}°`;
  $("rAlt").textContent =state.alt.toFixed(2);
}
S.fold.oninput=e=>{ seq=null; rig.setFold(+e.target.value); syncUI(); };
S.rpm.oninput =e=>{ seq=null; rig.setRotor(+e.target.value); syncUI(); };
S.pan.oninput =e=>{ seq=null; rig.setGimbal(+e.target.value, state.tilt); syncUI(); };
S.tilt.oninput=e=>{ seq=null; rig.setGimbal(state.pan, +e.target.value); syncUI(); };
function pick(m){ setMode(m);
  for(const [id,v] of [["bSimple","simple"],["bTech","tech"],["bField","field"],
                       ["bTarget","target"],["bSolid","solid"]])
    $(id).classList.toggle("on", v===m); }
$("bSimple").onclick=()=>pick("simple");
$("bTech").onclick  =()=>pick("tech");
$("bField").onclick =()=>pick("field");
$("bTarget").onclick=()=>pick("target");
$("bSolid").onclick =()=>pick("solid");
$("bLaunch").onclick=launch;
$("bReset").onclick =reset;

let tris=0; for(const p of parts){ const g=p.geometry; tris += (g.index?g.index.count:g.attributes.position.count)/3; }
$("rTri").textContent = Math.round(tris).toLocaleString("en-US");
$("rPart").textContent = parts.length;

/* ---- frame ---------------------------------------------------- */
function render(){
  placeCamera();
  root.updateMatrixWorld(true);
  updateSilhouettes(camera);                 // silhouettes are view-dependent
  renderer.render(scene,camera);
}
let elapsed = 0;
function frame(dt){ elapsed += dt; runSequence(dt); rig.advance(dt); animateField(elapsed); render(); }

window.__DRONE = {
  THREE, scene, root, rig, parts, camera, cam, renderer, seams, extras,
  setMode, launch, reset, render,
  seek(t){ rig.seek(t); animateField(t); render(); },
  cloudTargets : cloudGeo.attributes.position.array,
  resample     : (n,seed)=>sampleSurface(parts,n,seed),
  bounds       : BOUNDS, size:SIZE, radius:RAD,
};

pick(Q.get("mode")||"tech"); syncUI();
const T = Q.get("t");
if(T!==null){ const t=parseFloat(T); rig.setRotor(4200); rig.seek(t); animateField(t); render(); }
else if(REDUCE){ render(); }
else { const clock=new THREE.Clock(); renderer.setAnimationLoop(()=>frame(Math.min(clock.getDelta(),0.05))); }
window.__ready = true; document.title="ready";
console.log("DRONE_MODEL_RIG ready ·", parts.length, "parts ·", Math.round(tris), "tris");
</script>
</body>
</html>
